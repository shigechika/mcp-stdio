name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned, not floating: a ruff release that adds a rule to its default
      # set would otherwise turn this gate red on a commit that changed
      # nothing. Bumping it is then a deliberate PR with the new findings
      # visible in the diff.
      - name: Install ruff
        run: pip install ruff==0.16.0

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Smoke-test on Windows to guard against stdio newline regressions
          # (cf. modelcontextprotocol/python-sdk#2433). One Python version is
          # sufficient since the bug is platform-level, not version-specific.
          - os: windows-latest
            python-version: "3.x"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  # Version-free required status check for the branch ruleset. The matrix
  # legs above are named after their Python version, so binding the ruleset
  # to them meant editing it on every Python bump; bind it to this job instead.
  # `needs.test.result` is "success" only when every matrix leg succeeded.
  test-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: needs.test.result != 'success'
        run: exit 1
