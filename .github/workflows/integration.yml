name: Integration

# End-to-end harness against python-sdk v2 (the 2026-07-28 reference peer),
# issue #367. Advisory: deliberately NOT in the required-checks gate
# (branch protection + ruleset ci-gate-main list only the unit-test matrix)
# until it proves stable. Promoting it later means editing BOTH definitions.
#
# TWO jobs since #270 Phase 3 P3-0, because the directory now holds two
# kinds of suite:
#   integration — everything, reference-peer scenarios included.
#   serve       — the serve-mode suites ONLY, installed WITHOUT the peer.
#
# The second is not redundant with the first. It decouples serve signal
# from peer resolution — today a bad `mcp>=2.0,<3` resolution fails the
# version-smoke step and would take the serve suites down with it, though
# they need nothing from the peer — and it is the ONLY thing that
# exercises the conftest allow-list that keeps those suites collectable
# when the peer is absent. If that guard regresses, this job collects zero
# tests and pytest's exit code 5 fails it, instead of the serve suites
# vanishing silently, which is the exact false green the allow-list exists
# to prevent.
#
# ubuntu only, like #367: the harness ends subprocesses with SIGTERM
# (serve's own documented shutdown path, which reaps its children in a
# `finally`), and `Popen.terminate()` does not deliver a catchable signal
# on Windows. The unit matrix already covers serve there.

on:
  pull_request:
  workflow_dispatch:

# Private repository: without this, checkout fails.
permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Outermost safety valve. The suite runs in ~17 s locally; the layers
    # below it are the per-step expect timeout (5 s) and pytest-timeout
    # (30 s/test, injected by tests_integration/conftest.py).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # One version, not a matrix: the point is interop with the
          # reference peer, and the unit matrix already covers 3.10-3.14.
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev,integration]"

      - name: Reference-peer version smoke
        # `mcp.__version__` does not exist in v2.0.0 — the version lives
        # only in distribution metadata. The suite asserts the same thing
        # once per session; this fails the job before any test runs when the
        # `mcp>=2.0,<3` range resolves somewhere unexpected.
        run: |
          python -c "
          from importlib.metadata import version
          v = version('mcp')
          print('mcp', v)
          assert v.split('.')[0] == '2', v
          "

      - name: Integration tests
        # `-s` (no capture) on purpose: scenario 6 measures and prints how
        # long the reference peer took to turn the relay's aborted POST into
        # a cancellation, and that number differs by an order of magnitude
        # between platforms (see the comment at that wait). Captured output
        # is only shown for FAILING tests, so without `-s` the healthy value
        # never reaches the log and a slow drift toward the timeout would be
        # invisible until the day it goes red.
        run: pytest tests_integration/ -v -s

  serve:
    # #270 Phase 3 P3-0. The serve-mode suites — the AC2 legacy pin base
    # and the gateway sandwich — run here with NO reference peer installed.
    runs-on: ubuntu-latest
    # Well under the sibling job's budget: these suites run in ~15 s
    # locally and spawn only our own subprocesses.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install (no reference peer)
        # `[dev]` ONLY, deliberately: installing `[integration]` here would
        # defeat the job's purpose, which is to prove these suites stand up
        # without the peer.
        run: pip install -e ".[dev]"

      - name: Serve-mode suites
        # A directory-wide run, not a file list: with the peer absent the
        # conftest allow-list collect-ignores the peer-dependent modules,
        # so this collects exactly the serve suites — and exits 5 (failing
        # the job) if that guard ever stops working.
        run: pytest tests_integration/ -v
